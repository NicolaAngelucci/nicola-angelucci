/* FULL-PAGE PHOTOGRAPHIC DESIGN — scoped to Biography and Contact only. */
html, body {min-height:100%;}
body.photo-page {background:#090909; position:relative; isolation:isolate;}
body.photo-page::before {
  content:""; position:fixed; inset:0; z-index:-2;
  background-image:var(--fullpage-photo);
  background-position:var(--photo-position,center center);
  background-repeat:no-repeat; background-size:var(--photo-size,cover);
  filter:var(--photo-filter,none);
  transform:translateZ(0);
}
body.photo-page::after {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:var(--photo-overlay);
}
body.photo-page header {background:rgba(8,8,8,.5);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
body.photo-page main {position:relative; min-height:calc(100vh - 160px); background:transparent;}
body.photo-page .pageHead {padding:clamp(108px,12vh,158px) clamp(24px,7vw,110px) 12px; background:transparent;}
body.photo-page .pageHead h1 {font-size:clamp(42px,5vw,74px);text-shadow:0 4px 20px rgba(0,0,0,.6)}
body.bio-fullphoto .pageHead h1, body.bio-fullphoto .prose {backdrop-filter:blur(0px);} 
body.photo-page .content {background:transparent; max-width:none; padding:20px clamp(24px,7vw,110px) 105px;}
body.photo-page footer {position:relative; background:rgba(8,8,8,.44);border-color:rgba(255,255,255,.13);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.photo-page .columns {display:block;}
body.photo-page .old-photo {display:none !important;}
/* Biography: understated reading surface. The image remains full bleed behind it. */
body.bio-fullphoto {--photo-position:73% center;--photo-size:cover;--photo-filter:contrast(1.08) saturate(1.05) brightness(1.02);--photo-overlay:linear-gradient(90deg,rgba(5,5,5,.82) 0%,rgba(5,5,5,.73) 29%,rgba(5,5,5,.46) 55%,rgba(5,5,5,.05) 100%);}
body.bio-fullphoto .prose {width:min(100%,700px);max-width:700px;padding:0 0 25px; color:#f3efeb;}
body.bio-fullphoto .prose p {font-size:clamp(15px,1.2vw,17px);line-height:1.85;color:#eee9e5;text-shadow:0 2px 10px rgba(0,0,0,.58);}
body.bio-fullphoto .prose p:first-child {font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#fff;}
/* Contacts: image is dominant; social links sit inside the available negative space. */
body.contact-fullphoto {--photo-position:55% 24%;--photo-size:cover;--photo-filter:contrast(1.02) brightness(.98);--photo-overlay:linear-gradient(90deg,rgba(0,0,0,.89) 0%,rgba(0,0,0,.69) 34%,rgba(0,0,0,.21) 73%,rgba(0,0,0,.27) 100%);}
body.contact-fullphoto main {min-height:calc(100svh - 135px);}
body.contact-fullphoto .content {padding-top:38px;padding-bottom:90px;}
body.contact-fullphoto .socials {display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:450px;margin:0;}
body.contact-fullphoto .socials a {font-family:'Jost',sans-serif;font-weight:400;font-size:28px;letter-spacing:normal;line-height:normal;color:#f4f0e9;text-shadow:none;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.15);padding:22px 0;transition:color .2s ease,border-color .2s ease;}
body.contact-fullphoto .socials a:hover {color:#e8bf9f;border-color:#e8bf9f;}
@media(max-width:850px){
  body.photo-page .pageHead {padding-top:106px;padding-bottom:8px;}
  body.photo-page .content {padding-bottom:75px;}
  body.bio-fullphoto {--photo-position:67% center;--photo-overlay:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.68) 58%,rgba(0,0,0,.47));}
  body.bio-fullphoto .prose {max-width:690px;}
  body.contact-fullphoto {--photo-position:57% center;--photo-overlay:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.6) 60%,rgba(0,0,0,.3));}
}
@media(max-width:520px){
  body.photo-page .pageHead {padding:88px 21px 9px;}
  body.photo-page .content {padding:18px 21px 62px;}
  body.bio-fullphoto {--photo-position:65% center;--photo-overlay:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.76));}
  body.bio-fullphoto .prose p {font-size:15px;line-height:1.76;}
  body.contact-fullphoto {--photo-position:58% center;--photo-overlay:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.54));}
  body.contact-fullphoto .socials a {font-size:26px;padding:18px 0;}
}
@media(prefers-reduced-motion:reduce){body.contact-fullphoto .socials a{transition:none;}}
